<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Network Paths / Reverse Proxy Arrows -->
  <!-- Left to Center -->
  <path d="M14 32 H26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3"/>
  <!-- Center to Top-Right -->
  <path d="M38 28 L48 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Center to Bottom-Right -->
  <path d="M38 36 L48 44" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Client Node -->
  <circle cx="14" cy="32" r="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5"/>
  
  <!-- Central Proxy Hub -->
  <circle cx="32" cy="32" r="9" fill="url(#hubGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="3.5" fill="#0f172a"/>

  <!-- Upstream Target Node 1 (Top Right) -->
  <circle cx="50" cy="18" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Upstream Target Node 2 (Bottom Right) -->
  <circle cx="50" cy="46" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
</svg>
